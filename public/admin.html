<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP -->
    <div class="top">

        <h2>Admin Panel</h2>

        <button onclick="window.location.href='index.html'">
            User sahifa
        </button>

    </div>

    <!-- CONTAINER -->
    <div class="container">

        <!-- DESIGN -->
        <div class="card">

            <h3>Sayt dizayni</h3>

            <input type="text" id="title" placeholder="Sarlavha">

            <input type="color" id="color">

            <textarea id="desc" placeholder="Tavsif"></textarea>

            <button class="save" onclick="saveDesign()">
                Saqlash
            </button>

            <div class="preview" id="preview"></div>

        </div>

        <!-- ADD TASK -->
        <div class="card">

            <h3>To‘lov qo‘shish</h3>

            <input type="text" id="name" placeholder="Ism familiya">

            <input type="text" id="order" placeholder="Tartib raqam">

            <input type="text" id="reason" placeholder="Nima uchun to‘lov">

            <select id="status">
                <option value="true">✔ To‘langan</option>
                <option value="false">✖ To‘lanmagan</option>
            </select>

            <button class="save" onclick="addTask()">
                Qo‘shish
            </button>

        </div>

        <!-- TASK LIST -->
        <div id="list"></div>

    </div>

    <script src="admin.js"></script>

</body>

</html>
